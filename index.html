<script>

// ===============================
// DONNÉES
// ===============================

let children = JSON.parse(
    localStorage.getItem("children") || "[]"
);

let attendance = JSON.parse(
    localStorage.getItem("attendance") || "{}"
);

// ===============================
// DATE DU JOUR
// ===============================

const dateInput = document.getElementById("date");

let today = new Date();

let yyyy = today.getFullYear();
let mm = String(today.getMonth() + 1).padStart(2, "0");
let dd = String(today.getDate()).padStart(2, "0");

dateInput.value = `${yyyy}-${mm}-${dd}`;

dateInput.addEventListener("change", render);

// ===============================
// AJOUTER UN ENFANT
// ===============================

function addChild() {

    const input = document.getElementById("childName");

    const name = input.value.trim();

    if (!name) {
        alert("Veuillez saisir le nom de l'enfant.");
        return;
    }

    children.push({
        id: Date.now(),
        name: name
    });

    localStorage.setItem(
        "children",
        JSON.stringify(children)
    );

    input.value = "";

    render();
}

// ===============================
// SUPPRIMER UN ENFANT
// ===============================

function deleteChild(id) {

    if (!confirm("Supprimer cet enfant ?")) {
        return;
    }

    children = children.filter(
        child => child.id !== id
    );

    localStorage.setItem(
        "children",
        JSON.stringify(children)
    );

    render();
}

// ===============================
// MARQUER PRÉSENCE
// ===============================

function setStatus(id, status) {

    const date = dateInput.value;

    if (!attendance[date]) {
        attendance[date] = {};
    }

    attendance[date][id] = status;

    localStorage.setItem(
        "attendance",
        JSON.stringify(attendance)
    );

    render();
}

// ===============================
// AFFICHER LES ENFANTS
// ===============================

function renderChildren() {

    const container =
        document.getElementById("childrenList");

    container.innerHTML = "";

    if (children.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucun enfant enregistré.</div>';

        return;
    }

    const date = dateInput.value;

    children.forEach(child => {

        const status =
            attendance[date]?.[child.id] || "";

        const div =
            document.createElement("div");

        div.className = "child";

        div.innerHTML = `

            <div class="child-name">
                👤 ${child.name}
            </div>

            <div class="status-buttons">

                <button
                    class="btn-present ${status === "present" ? "active" : ""}"
                    onclick="setStatus(${child.id}, 'present')">
                    ✅ Présent
                </button>

                <button
                    class="btn-absent ${status === "absent" ? "active" : ""}"
                    onclick="setStatus(${child.id}, 'absent')">
                    ❌ Absent
                </button>

                <button
                    class="btn-excused ${status === "excused" ? "active" : ""}"
                    onclick="setStatus(${child.id}, 'excused')">
                    🟡 Excusé
                </button>

            </div>

            <div class="child-actions">

                <button
                    class="btn-danger"
                    onclick="deleteChild(${child.id})">
                    🗑️ Supprimer
                </button>

            </div>
        `;

        container.appendChild(div);
    });
}

// ===============================
// STATISTIQUES
// ===============================

function updateStats() {

    const date = dateInput.value;

    let present = 0;
    let absent = 0;
    let excused = 0;

    children.forEach(child => {

        const status =
            attendance[date]?.[child.id];

        if (status === "present") present++;

        if (status === "absent") absent++;

        if (status === "excused") excused++;
    });

    document.getElementById("totalPresent")
        .textContent = present;

    document.getElementById("totalAbsent")
        .textContent = absent;

    document.getElementById("totalExcused")
        .textContent = excused;
}

// ===============================
// HISTORIQUE
// ===============================

function renderHistory() {

    const container =
        document.getElementById("history");

    container.innerHTML = "";

    const dates =
        Object.keys(attendance).sort().reverse();

    if (dates.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucun historique.</div>';

        return;
    }

    dates.forEach(date => {

        let present = 0;
        let absent = 0;
        let excused = 0;

        children.forEach(child => {

            const status =
                attendance[date]?.[child.id];

            if (status === "present") present++;

            if (status === "absent") absent++;

            if (status === "excused") excused++;
        });

        const div =
            document.createElement("div");

        div.className = "history-item";

        div.innerHTML = `
            <strong>📅 ${date}</strong><br>
            ✅ ${present} présents |
            ❌ ${absent} absents |
            🟡 ${excused} excusés
        `;

        container.appendChild(div);
    });
}

// ===============================
// AFFICHAGE GLOBAL
// ===============================

function render() {

    renderChildren();

    updateStats();

    renderHistory();
}

render();

</script>

</body>
